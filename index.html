<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Path of Exile 2 - Closed Beta Countdown</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <img id="poe2-top-section-logo" src="logo.png" alt="">

  <div class="closed-time-text">
    Dec 6 2024
  </div>

  <div id="countdown2" class="countdown">
    <div id="seconds2" style="" class="countdown-div"></div>
  </div>

  <div class="closed-time-text">
    Jun 7 2024
  </div>
  <div id="countdown" class="countdown">
    <div id="seconds" style="" class="countdown-div"></div>
  </div>
  <div class="progress">
    <progress id="progress"  max="100" value="70">70%</progress>
  </div>
  <div class="progressLabel">
    <label id="progressLabel"></label>
  </div>

  <script>
  var countDownDate = new Date("Jun 7, 2024 19:00:00Z").getTime();
  var countDownDate2 = new Date("Dec 6, 2024 20:00:00Z").getTime();
  var x = setInterval(function() {
    var now = new Date().getTime();
    var distance = countDownDate - now;
    document.getElementById("seconds").innerHTML = Math.floor(distance / 1000);

    var distance2 = countDownDate2 - now;
    document.getElementById("seconds2").innerHTML = Math.floor(distance2 / 1000);

    let percent = (now - countDownDate) / (countDownDate2 - countDownDate) * 100;

    document.getElementById("progress").value = percent
    document.getElementById("progressLabel").textContent =Math.round((percent + Number.EPSILON) * 100) / 100 + '%'

  }, 1000);
  </script>

</body>
</html>
